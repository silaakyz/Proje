# Local PostgreSQL 16 with pgvector for development and presentations.
#   docker compose up -d db        start (data persists in the eip-pgdata volume)
#   docker compose down            stop (add -v to delete the data)
# The password comes from POSTGRES_PASSWORD in .env (Docker Compose reads .env automatically).
# Then: npm run drizzle:migrate && npm run demo:seed
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eip
      POSTGRES_DB: eip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432" # reachable from this computer only
    volumes:
      - eip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eip -d eip"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  eip-pgdata:
